<div class="bg-surface-container-low text-on-surface min-h-screen flex flex-col items-center justify-center p-margin-mobile font-body-lg antialiased">
  
  <!-- Card Principal da Ação Transacional de Logout -->
  <main class="bg-surface-container-lowest w-full max-w-sm rounded-xl border border-outline-variant shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-8 md:p-[48px] flex flex-col items-center text-center">
    
    <!-- Ícone de Logout -->
    <div class="bg-surface-container h-16 w-16 rounded-full flex items-center justify-center mb-6 text-on-surface-variant">
      <span class="material-symbols-outlined text-[32px]">
        logout
      </span>
    </div>

    <!-- Título e Texto Explicativo -->
    <h1 class="font-title-md text-title-md text-on-surface mb-2">
      Deseja realmente sair?
    </h1>
    <p class="font-body-md text-body-md text-on-surface-variant mb-8">
      Sua sessão atual será encerrada. Certifique-se de ter salvo todo o seu progresso.
    </p>

    <!-- Botões de Ação -->
    <div class="w-full flex flex-col gap-4">
      <!-- Ação Primária: Confirmar Saída -->
      <button
        type="button"
        (click)="onConfirmLogout()"
        [disabled]="isLoading()"
        class="w-full bg-primary-container text-on-primary py-3 px-6 rounded-lg font-label-sm text-label-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2"
      >
        @if (isLoading()) {
          <span class="animate-spin rounded-full h-4 w-4 border-2 border-on-primary border-t-transparent"></span>
        }
        {{ isLoading() ? 'Saindo...' : 'Sim, Sair' }}
      </button>

      <!-- Ação Secundária: Cancelar -->
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isLoading()"
        class="w-full bg-transparent border border-secondary text-secondary py-3 px-6 rounded-lg font-label-sm text-label-sm hover:bg-surface-container-highest transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 disabled:opacity-50"
      >
        Cancelar
      </button>
    </div>
  </main>

  <!-- Identificação da Marca UFAPE -->
  <div class="mt-8 flex items-center gap-2 text-on-surface-variant opacity-75">
    <span class="font-title-md text-title-md font-bold tracking-tight text-primary-container">UFAPE</span>
    <span class="font-body-md text-body-md">Gestão</span>
  </div>
</div>
